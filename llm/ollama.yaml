# helm upgrade ollama otwld/ollama --namespace llm -f ollama.yaml --wait

ollama:
  gpu:
    enabled: false

  # models:
  #   pull:
  #     - "mistral:7b"
  #     - "qwen2.5:3b"
  #     - "llama3.2"
  #     - "phi3:mini"
  #     - "qwen3.5:4b"
  #     - "gemma4:e4b"


persistentVolume:
  enabled: true
  size: 30Gi

resources:
  requests:
    cpu: "1500m"
    memory: "3Gi"
  limits:
    cpu: "3000m"
    memory: "5Gi"

extraEnv:
  - name: OLLAMA_NUM_PARALLEL
    value: "1"
  - name: OLLAMA_MAX_LOADED_MODELS
    value: "1"
  - name: OLLAMA_KEEP_ALIVE
    value: "5m"